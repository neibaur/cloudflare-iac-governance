[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
# A nested cache_dir keeps pytest's temporary cache-writing directories inside .pytest_cache.
cache_dir = ".pytest_cache/data"
addopts = [
  "--basetemp=.pytest_tmp",
  "--cov=scripts",
  "--cov=run_tools",
  "--cov-report=term-missing",
  "--cov-fail-under=85",
]

[tool.coverage.run]
omit = ["scripts/tests/*"]
