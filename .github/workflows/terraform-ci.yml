name: Terraform CI

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      run_remediation:
        description: "Run guarded Terraform remediation when compliance gaps are detected"
        required: true
        default: "N"
        type: choice
        options:
          - "N"
          - "Y"
      sync_to_sheets:
        description: "Sync anonymized compliance reports to Google Sheets"
        required: true
        default: "N"
        type: choice
        options:
          - "N"
          - "Y"

permissions:
  contents: read

jobs:
  quality-and-plan:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Run quality gate
        run: python scripts/run_all_checks.py

      - name: Terraform init
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform fmt check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Terraform plan
        run: terraform -chdir=terraform plan -refresh=false -input=false -var-file=ci.auto.tfvars

      - name: Run compliance audit
        run: python run_tools.py --audit

      - name: Check first audit for compliance gaps
        id: first_audit
        run: |
          if python scripts/check_compliance_gaps.py; then
            echo "gaps_detected=false" >> "$GITHUB_OUTPUT"
          else
            echo "gaps_detected=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log remediation gate state
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GAPS_DETECTED: ${{ steps.first_audit.outputs.gaps_detected }}
          FIX_DETECTED_GAPS_IS_Y: ${{ vars.FIX_DETECTED_GAPS == 'Y' }}
          IS_WORKFLOW_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          RUN_REMEDIATION_IS_Y: ${{ inputs.run_remediation == 'Y' }}
          SHEETS_SYNC_WILL_RUN: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_to_sheets == 'Y') }}
          REMEDIATION_CONDITIONS_SATISFIED: ${{ steps.first_audit.outputs.gaps_detected == 'true' && vars.FIX_DETECTED_GAPS == 'Y' && github.event_name == 'workflow_dispatch' && inputs.run_remediation == 'Y' }}
        run: |
          echo "github.event_name=$EVENT_NAME"
          echo "github.ref_name=$REF_NAME"
          echo "steps.first_audit.outputs.gaps_detected=$GAPS_DETECTED"
          echo "vars.FIX_DETECTED_GAPS == 'Y': $FIX_DETECTED_GAPS_IS_Y"
          echo "github.event_name == 'workflow_dispatch': $IS_WORKFLOW_DISPATCH"
          echo "inputs.run_remediation == 'Y': $RUN_REMEDIATION_IS_Y"
          echo "Google Sheets sync will run: $SHEETS_SYNC_WILL_RUN"
          echo "Remediation will run: $REMEDIATION_CONDITIONS_SATISFIED"

      - name: Apply Terraform remediation
        if: ${{ steps.first_audit.outputs.gaps_detected == 'true' && vars.FIX_DETECTED_GAPS == 'Y' && github.event_name == 'workflow_dispatch' && inputs.run_remediation == 'Y' }}
        env:
          REAL_TFVARS: ${{ secrets.REAL_TFVARS }}
        run: |
          trap 'rm -f terraform/remediation.tfvars' EXIT
          echo "$REAL_TFVARS" > terraform/remediation.tfvars
          terraform -chdir=terraform apply -auto-approve -input=false -var-file=remediation.tfvars

      - name: Run post-remediation compliance audit
        if: ${{ steps.first_audit.outputs.gaps_detected == 'true' && vars.FIX_DETECTED_GAPS == 'Y' && github.event_name == 'workflow_dispatch' && inputs.run_remediation == 'Y' }}
        run: python run_tools.py --audit

      - name: Verify post-remediation compliance
        if: ${{ steps.first_audit.outputs.gaps_detected == 'true' && vars.FIX_DETECTED_GAPS == 'Y' && github.event_name == 'workflow_dispatch' && inputs.run_remediation == 'Y' }}
        run: python scripts/check_compliance_gaps.py

      - name: Log Google Sheets sync gate state
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GAPS_DETECTED: ${{ steps.first_audit.outputs.gaps_detected }}
          FIX_DETECTED_GAPS_IS_Y: ${{ vars.FIX_DETECTED_GAPS == 'Y' }}
          IS_SCHEDULE: ${{ github.event_name == 'schedule' }}
          IS_WORKFLOW_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          SYNC_TO_SHEETS_IS_Y: ${{ inputs.sync_to_sheets == 'Y' }}
          SHEETS_SYNC_CONDITIONS_SATISFIED: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_to_sheets == 'Y') }}
          REMEDIATION_CONDITIONS_SATISFIED: ${{ steps.first_audit.outputs.gaps_detected == 'true' && vars.FIX_DETECTED_GAPS == 'Y' && github.event_name == 'workflow_dispatch' && inputs.run_remediation == 'Y' }}
        run: |
          echo "github.event_name=$EVENT_NAME"
          echo "github.ref_name=$REF_NAME"
          echo "steps.first_audit.outputs.gaps_detected=$GAPS_DETECTED"
          echo "vars.FIX_DETECTED_GAPS == 'Y': $FIX_DETECTED_GAPS_IS_Y"
          echo "github.event_name == 'schedule': $IS_SCHEDULE"
          echo "github.event_name == 'workflow_dispatch': $IS_WORKFLOW_DISPATCH"
          echo "inputs.sync_to_sheets == 'Y': $SYNC_TO_SHEETS_IS_Y"
          echo "Google Sheets sync will run: $SHEETS_SYNC_CONDITIONS_SATISFIED"
          echo "Remediation will run: $REMEDIATION_CONDITIONS_SATISFIED"

      - name: Install BI sync dependencies
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_to_sheets == 'Y') }}
        run: python -m pip install -r requirements.txt

      - name: Sync compliance reports to Google Sheets
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_to_sheets == 'Y') }}
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          trap 'rm -f service_account.json' EXIT
          echo "$GCP_SERVICE_ACCOUNT_KEY" > service_account.json
          python scripts/aggregate_to_sheets.py

      - name: Upload compliance reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-compliance-reports
          path: reports/
          if-no-files-found: error
