name: Terraform CI

on:
  push:
    branches:
      - "**"

jobs:
  quality-and-plan:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Run quality gate
        run: python scripts/run_all_checks.py

      - name: Terraform init
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Terraform plan
        run: terraform -chdir=terraform plan -input=false -var-file=ci.auto.tfvars

      - name: Run compliance audit
        run: python run_tools.py --audit

      - name: Install BI sync dependencies
        run: python -m pip install -r requirements.txt

      - name: Sync compliance reports to Google Sheets
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          trap 'rm -f service_account.json' EXIT
          echo "$GCP_SERVICE_ACCOUNT_KEY" > service_account.json
          python scripts/aggregate_to_sheets.py

      - name: Upload compliance reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-compliance-reports
          path: reports/
          if-no-files-found: error
