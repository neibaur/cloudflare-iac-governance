name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ci-placeholder-token
      CLOUDFLARE_ACCOUNT_ID: "00000000000000000000000000000000"
      TF_VAR_cloudflare_account_id: "00000000000000000000000000000000"

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.9"

      - name: Run Python quality gate
        run: python scripts/run_all_checks.py

      # The same script operators and workers run locally: fmt, validate, test, and the mock plan
      # against a local backend, refusing when Terraform state is present.
      - name: Run Terraform mock gate
        shell: pwsh
        run: ./scripts/run-terraform-mock-gate.ps1
