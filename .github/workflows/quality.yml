name: Quality

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ci-placeholder-token
      CLOUDFLARE_ACCOUNT_ID: "00000000000000000000000000000000"
      TF_VAR_cloudflare_account_id: "00000000000000000000000000000000"

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Run Python quality gate
        run: python scripts/run_all_checks.py

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform -chdir=terraform init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Plan Terraform with mock CI values
        run: terraform -chdir=terraform plan -refresh=false -input=false -var-file=ci.auto.tfvars
